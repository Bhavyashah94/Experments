services:
  header-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: experiment_header_app
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - ANALYTICS_ADMIN_PASSWORD=${ANALYTICS_ADMIN_PASSWORD:-Raster0912@}
    volumes:
      - ./output:/app/output
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped
